name: Build WIT
description: Build a WIT package under spec/ with wkg

inputs:
  package:
    description: "Package directory name under spec/ (e.g. std)"
    required: true

outputs:
  version:
    description: "Package version read from wit/package.wit"
    value: ${{ steps.build.outputs.version }}
  path:
    description: "Path to the built WIT package (.wasm)"
    value: ${{ steps.build.outputs.path }}

runs:
  using: composite
  steps:
    - run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/1800853f2578f8c34492ec76154caef8e163fbca/install-from-binstall-release.sh | bash # v1.17.7
      shell: bash
      env:
        BINSTALL_VERSION: 1.17.7

    - run: cargo binstall "wkg@${WKG_VERSION}" -y
      shell: bash
      env:
        WKG_VERSION: 0.16.2

    - id: build
      run: ruby "${GITHUB_ACTION_PATH}/build.rb" "${PACKAGE}"
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
