name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  jsr:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check **/*.ts
      - run: deno publish

  wit:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [std, document, fetch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: build
        uses: ./.github/actions/build-wit
        with:
          package: ${{ matrix.package }}

      - run: |
          wkg oci push \
            "ghcr.io/a-skua/web/${PACKAGE}:${VERSION}" \
            "${WIT_PATH}"
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.build.outputs.version }}
          WIT_PATH: ${{ steps.build.outputs.path }}
          WKG_OCI_USERNAME: ${{ github.actor }}
          WKG_OCI_PASSWORD: ${{ github.token }}

  release:
    needs:
      - jsr
      - wit
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
